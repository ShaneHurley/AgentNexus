schema_version: "1.0.0"
locked_defaults:
  source_systems:
    - public_web
    - arxiv
    - local_files
  mock_by_default: true
  paywall_disclosure: >-
    No paywalled full-text claims beyond disclosed access level; metadata and
    abstract-only access must be labeled explicitly on every evidence card.
  director_second_call: >-
    Second Principal Director call disabled except explicitly approved XL runs
    with approval token, conflict flag, and budget reserve.
  plan_reference: >-
    deep_researcher_ecosystem_38ffc398.plan.md locked defaults (package path,
    mock-by-default, read-only discovery).
decisions:
