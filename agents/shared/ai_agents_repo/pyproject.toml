[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents-repo"
version = "0.1.0"
description = "Marker-based repository layout discovery and path resolution for the ai_agents monorepo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
