[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-forge"
version = "0.7.0+experiments"
description = "Evidence-first deep research agent with local token-free experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Research Forge" }]
dependencies = [
  "typer>=0.12.0",
  "pyyaml>=6.0",
  "jsonschema>=4.23.0",
  "referencing>=0.35.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
research-forge = "research_forge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/research_forge"]

# Ship config/ + schemas/ next to the package so find_package_root() works
# after a normal (non-editable) install without RF_PACKAGE_ROOT.
[tool.hatch.build.targets.wheel.force-include]
"config" = "config"
"schemas" = "schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
packages = ["research_forge"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml.*", "jsonschema.*"]
ignore_missing_imports = true
