[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-coder-ecosystem"
version = "0.1.0"
description = "Token-frugal artifact-driven coding agent orchestration"
requires-python = ">=3.10"
dependencies = ["keyring>=25"]

[project.scripts]
daily-coder = "daily_coder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["daily_coder*"]

[tool.setuptools.package-data]
daily_coder = ["dashboard/*.html"]
