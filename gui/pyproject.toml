[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dashboard"
version = "0.1.0"
description = "Shared modular GUI for local agent orchestration"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-dashboard = "agent_dashboard.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_dashboard*"]

[tool.setuptools.package-data]
agent_dashboard = ["web/*", "web/**/*", "docs/*.md"]
